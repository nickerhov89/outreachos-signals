<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}OutreachOS Signals{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">
      <span class="brand-logo">🎯</span> OutreachOS Signals
    </a>
    <div class="d-flex">
      <a class="nav-link text-white px-2" href="/">Dashboard</a>
      <a class="nav-link text-white px-2" href="/leads">Top Leads</a>
      <div class="nav-link text-white px-2 dropdown">
        <a class="text-white text-decoration-none dropdown-toggle" data-bs-toggle="dropdown" href="#">Niches</a>
        <ul class="dropdown-menu dropdown-menu-end">
          {% for n in range_niches %}
          <li><a class="dropdown-item" href="/niche/{{ n.id }}">{{ n.emoji }} {{ n.name }}</a></li>
          {% endfor %}
        </ul>
      </div>
      <a class="nav-link text-white px-2" href="/api/export.xlsx?min_score=7">📥 Export</a>
      <a class="nav-link text-white px-2" href="/health">💚</a>
    </div>
  </div>
</nav>
<div class="container-fluid px-4">
{% block content %}{% endblock %}
</div>
<footer class="text-center text-muted mt-5 mb-3 small">
  OutreachOS Signals · v0.1.0 · {{ total_events if total_events else 0 }} events
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
